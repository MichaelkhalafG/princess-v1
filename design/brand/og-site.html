<!doctype html>
<!--
  Source of app/opengraph-image.png, the image shown when the board is shared (WhatsApp,
  Instagram, X). 1200 × 630, from the logo file's "6 · Open Graph" frame: blush ground,
  52px lockup, Arabic copy from the board's hero.

  Rendered in a browser, not with next/og: Satori lays Arabic words out left to right and
  reverses punctuation inside words ("ج.م" → "م.ج"). To re-render, open this file in
  Chrome at exactly 1200 × 630 (device scale 1), wait for the fonts, and capture the page.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Princess Open Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=Gabarito:wght@700&family=Readex+Pro:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #1C0A14;
    --disc: #EE6F9C;
    --blush: #FFF6F1;
    --text: #3D2A33;
    --secondary: #3D7F79;
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--blush);
  }
  .og {
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .lockup {
    display: flex;
    align-items: flex-end;
    align-self: flex-start;
    font-size: 52px;
  }
  .lockup svg { height: .75em; width: auto; margin-bottom: .145em; flex: none; }
  .lockup span {
    font-family: 'Gabarito', sans-serif;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1;
    color: var(--ink);
    margin-left: .03em;
  }
  .body {
    display: flex;
    align-items: center;
    gap: 56px;
  }
  .copy { flex: 1; display: flex; flex-direction: column; gap: 24px; }
  h1 {
    margin: 0;
    font-family: 'Alexandria', sans-serif;
    font-weight: 800;
    font-size: 66px;
    line-height: 1.15;
    color: var(--ink);
  }
  p {
    margin: 0;
    font-family: 'Readex Pro', sans-serif;
    font-size: 30px;
    line-height: 1.5;
    color: var(--text);
    max-width: 640px;
  }
  .where {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Readex Pro', sans-serif;
    font-weight: 500;
    font-size: 28px;
    color: var(--secondary);
  }
  .where::before {
    content: '';
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--secondary);
    flex: none;
  }
  .mark {
    width: 300px;
    height: 360px;
    flex: none;
    border-radius: 24px 120px 24px 24px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { height: 168px; width: auto; }
</style>
</head>
<body>
  <div class="og">
    <div class="lockup" dir="ltr">
      <svg viewBox="0 0 34 32" aria-hidden="true"><rect width="8" height="32" rx="4" fill="#1C0A14"/><circle cx="20" cy="13" r="13" fill="#EE6F9C"/></svg>
      <span>rincess</span>
    </div>
    <div class="body">
      <div class="copy">
        <h1>عملكِ يصل<br>إلى كل سيدة حولك</h1>
        <p>اعرضي خدمتك أو ملابسك، وتتواصل معك من تحتاجها عبر واتساب مباشرة.</p>
        <div class="where">مصر والسعودية والإمارات</div>
      </div>
      <div class="mark">
        <svg viewBox="0 0 34 32" aria-hidden="true"><rect width="8" height="32" rx="4" fill="#1C0A14"/><circle cx="20" cy="13" r="13" fill="#EE6F9C"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
